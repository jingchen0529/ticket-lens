name: Build Windows Desktop

# 在 Windows 上打 Tauri 安装包（Mac 上打不了 Windows 包，见项目记忆）。
# 触发：打 tag（v*）自动发布，或手动 workflow_dispatch。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install pyinstaller

      # 关键：把 Chromium 下到项目内固定目录，避免猜 revision 号。
      # 无头 + 有头两个二进制都要（见项目记忆：headless_shell 与 chromium 分开）。
      - name: Download Playwright Chromium (into bundle dir)
        working-directory: backend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\backend\pw-browsers
        run: |
          uv run playwright install chromium

      - name: Build backend exe (PyInstaller)
        working-directory: backend/packaging
        run: |
          uv run pyinstaller daxi.spec --noconfirm

      # 把 Chromium 目录复制到后端 dist 内的 ms-playwright/，
      # 运行时 app/core/paths.py:setup_browser_env 会自动指向它。
      - name: Bundle Chromium into backend dist
        shell: pwsh
        run: |
          $src = "${{ github.workspace }}\backend\pw-browsers"
          $dst = "${{ github.workspace }}\backend\packaging\dist\daxi\ms-playwright"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path "$src\*" -Destination $dst -Recurse -Force
          Get-ChildItem $dst

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # tauri build 会自动 npm run build（前端）+ cargo build（壳）+ 打 nsis 安装包，
      # 并把 tauri.conf.json 里的 resources（backend/packaging/dist/daxi）打进包。
      - name: Tauri build
        working-directory: frontend
        run: npx tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: daxi-windows-installer
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
