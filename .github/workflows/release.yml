name: Release

# 打 tag（v*）自动在各平台打包并发布 GitHub Release；也可手动触发只跑构建。
#
# 关键约束（见 BUILD.md / 项目记忆）：
# - PyInstaller 不能跨平台、也不能跨架构，所以每个目标平台/架构都要在对应 runner 上原生打后端。
#   macOS 因此拆成 arm64(macos-14) 和 x86_64(macos-13) 两个 job，不用 universal 壳。
# - Playwright 的有头 Chromium 和无头 headless_shell 是两个不同二进制，两个都必须打进包。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
          - label: macos-aarch64
            os: macos-14
            rust_target: aarch64-apple-darwin
            bundles: dmg
          - label: macos-x86_64
            os: macos-13
            rust_target: x86_64-apple-darwin
            bundles: dmg
          # 不打 rpm：ubuntu runner 没有 rpmbuild，客户也只用 Win/Mac。
          - label: linux-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf \
            libssl-dev librsvg2-dev libxdo-dev \
            libgtk-3-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install backend deps + PyInstaller
        shell: bash
        working-directory: backend
        run: |
          set -euxo pipefail
          uv venv
          uv pip install -e ".[dev]"
          uv pip install pyinstaller

      # 下到项目内固定目录，避免在后续步骤猜 Chromium revision 号。
      - name: Download Playwright Chromium
        shell: bash
        working-directory: backend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/backend/pw-browsers
        run: uv run playwright install chromium

      - name: Build backend binary (PyInstaller)
        shell: bash
        working-directory: backend/packaging
        run: uv run pyinstaller daxi.spec --noconfirm

      # 运行时 app/core/paths.py:setup_browser_env() 会把 PLAYWRIGHT_BROWSERS_PATH
      # 指向后端 exe 同级的 ms-playwright/。
      # macOS 必须用 ditto：cp -R 会破坏 Chromium .app bundle 里的符号链接和权限。
      - name: Bundle Chromium into backend dist
        shell: bash
        run: |
          set -euxo pipefail
          src="backend/pw-browsers"
          dst="backend/packaging/dist/daxi/ms-playwright"
          mkdir -p "$dst"
          if [ "$RUNNER_OS" = "macOS" ]; then
            for d in "$src"/*; do
              ditto "$d" "$dst/$(basename "$d")"
            done
          else
            cp -r "$src"/* "$dst"/
          fi
          ls -la "$dst"

      # 有头和无头是两个不同的 Chromium 二进制，客户场景两个都要用到，
      # 只带一个会在另一模式下确定性崩溃 —— 这里提前拦住，别等客户发现。
      - name: Verify both Chromium builds are bundled
        shell: bash
        run: |
          set -euo pipefail
          dst="backend/packaging/dist/daxi/ms-playwright"
          headful=$(find "$dst" -maxdepth 1 -type d -name 'chromium-*' | head -1 || true)
          headless=$(find "$dst" -maxdepth 1 -type d -name 'chromium_headless_shell-*' | head -1 || true)
          [ -n "$headful" ]  || { echo "::error::缺少有头 Chromium (chromium-*)"; exit 1; }
          [ -n "$headless" ] || { echo "::error::缺少无头 Chromium (chromium_headless_shell-*)"; exit 1; }
          echo "✅ headful:  $headful"
          echo "✅ headless: $headless"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
          key: ${{ matrix.label }}

      # tauri build 会顺带跑 npm run build（前端）并把 tauri.conf.json 的
      # resources（backend/packaging/dist/daxi）打进安装包。
      - name: Tauri build
        working-directory: frontend
        run: npx tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}

      - name: Collect installers
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          case "$version" in refs/*|"") version="dev" ;; esac

          bundle="frontend/src-tauri/target/$RUST_TARGET/release/bundle"
          out="release-assets"
          mkdir -p "$out"

          if [ ! -d "$bundle" ]; then
            echo "::error::未找到 bundle 目录: $bundle"
            find frontend/src-tauri/target -maxdepth 4 -type d -name bundle || true
            exit 1
          fi

          found=0
          while IFS= read -r f; do
            ext="${f##*.}"
            cp "$f" "$out/daxi-${version}-${LABEL}.${ext}"
            echo "collected: daxi-${version}-${LABEL}.${ext}"
            found=$((found + 1))
          done < <(find "$bundle" -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) | sort)

          if [ "$found" -eq 0 ]; then
            echo "::error::bundle 目录里没有任何安装包产物"
            find "$bundle" -type f | head -50
            exit 1
          fi
          ls -la "$out"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: daxi ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            ## daxi ${{ github.ref_name }}

            大麦/猫眼演出数据采集桌面客户端。

            ### 下载

            - **Windows (x86_64)**: `daxi-${{ github.ref_name }}-windows-x86_64.exe`（安装版）
            - **macOS (Apple Silicon)**: `daxi-${{ github.ref_name }}-macos-aarch64.dmg`
            - **macOS (Intel)**: `daxi-${{ github.ref_name }}-macos-x86_64.dmg`
            - **Linux (x86_64)**: `daxi-${{ github.ref_name }}-linux-x86_64.deb` / `.AppImage`

            > macOS 包未做 Apple 签名和公证，首次打开需右键 → 打开，或在
            > 「系统设置 → 隐私与安全性」中允许运行。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
