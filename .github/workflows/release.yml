name: Release

# 打 tag（v*）自动在各平台打包并发布 GitHub Release；也可手动触发只跑构建。
#
# 关键约束（见 BUILD.md / 项目记忆）：
# - PyInstaller 不能跨平台、也不能跨架构，所以每个目标平台/架构都要在对应 runner 上原生打后端。
#   macOS 因此只出 arm64(macos-14) 原生包，不用 universal 壳（Intel 见 matrix 注释）。
# - Playwright 的有头 Chromium 和无头 headless_shell 是两个不同二进制，两个都必须打进包。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
          # bundles 必须带 app：createUpdaterArtifacts 只在打 app 目标时才产出
          # macOS 的 updater 包（*.app.tar.gz + .sig）。只打 dmg 的话 Release 里
          # 没有 darwin-aarch64 条目，latest.json 缺该平台，Mac 客户端 check()
          # 直接报错 —— v1.0.4/v1.0.5 的「检查更新失败」就是这个原因。
          - label: macos-aarch64
            os: macos-14
            rust_target: aarch64-apple-darwin
            bundles: app,dmg
          # Intel Mac（macos-13）暂时下掉：v1.0.1 时该 runner 排队 2.5 小时仍未分配，
          # 把整条流水线和 Release 一起堵死。Apple Silicon 已是主流，需要 Intel 包时
          # 再把下面三行放回 matrix 即可（构建本身是通的，只是拿不到机器）。
          # - label: macos-x86_64
          #   os: macos-13
          #   rust_target: x86_64-apple-darwin
          #   bundles: dmg
          # 不打 rpm：ubuntu runner 没有 rpmbuild，客户也只用 Win/Mac。
          - label: linux-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf \
            libssl-dev librsvg2-dev libxdo-dev \
            libgtk-3-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install backend deps + PyInstaller
        shell: bash
        working-directory: backend
        run: |
          set -euxo pipefail
          uv venv
          uv pip install -e ".[dev]"
          uv pip install pyinstaller

      # 下到项目内固定目录，避免在后续步骤猜 Chromium revision 号。
      - name: Download Playwright Chromium
        shell: bash
        working-directory: backend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/backend/pw-browsers
        run: uv run playwright install chromium

      - name: Build backend binary (PyInstaller)
        shell: bash
        working-directory: backend/packaging
        run: uv run pyinstaller daxi.spec --noconfirm

      # 运行时 app/core/paths.py:setup_browser_env() 会把 PLAYWRIGHT_BROWSERS_PATH
      # 指向后端 exe 同级的 ms-playwright/。
      # macOS 必须用 ditto：cp -R 会破坏 Chromium .app bundle 里的符号链接和权限。
      - name: Bundle Chromium into backend dist
        shell: bash
        run: |
          set -euxo pipefail
          src="backend/pw-browsers"
          dst="backend/packaging/dist/daxi/ms-playwright"
          mkdir -p "$dst"
          if [ "$RUNNER_OS" = "macOS" ]; then
            for d in "$src"/*; do
              ditto "$d" "$dst/$(basename "$d")"
            done
          else
            cp -r "$src"/* "$dst"/
          fi
          ls -la "$dst"

      # 有头和无头是两个不同的 Chromium 二进制，客户场景两个都要用到，
      # 只带一个会在另一模式下确定性崩溃 —— 这里提前拦住，别等客户发现。
      - name: Verify both Chromium builds are bundled
        shell: bash
        run: |
          set -euo pipefail
          dst="backend/packaging/dist/daxi/ms-playwright"
          headful=$(find "$dst" -maxdepth 1 -type d -name 'chromium-*' | head -1 || true)
          headless=$(find "$dst" -maxdepth 1 -type d -name 'chromium_headless_shell-*' | head -1 || true)
          [ -n "$headful" ]  || { echo "::error::缺少有头 Chromium (chromium-*)"; exit 1; }
          [ -n "$headless" ] || { echo "::error::缺少无头 Chromium (chromium_headless_shell-*)"; exit 1; }
          echo "✅ headful:  $headful"
          echo "✅ headless: $headless"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
          key: ${{ matrix.label }}

      # 把 tag 版本号写进 tauri.conf.json。否则安装包内建版本恒为 0.1.0，
      # 装到客户机后每次都判定 latest.json 里的新版本更高 → 无限重复提示更新。
      # 只在 tag 触发时改；手动 workflow_dispatch 保持原版本用于烟测。
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          conf="frontend/src-tauri/tauri.conf.json"
          node -e "const fs=require('fs');const p='$conf';const j=JSON.parse(fs.readFileSync(p));j.version='$version';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
          echo "stamped version: $version"
          grep '"version"' "$conf"

      # tauri build 会顺带跑 npm run build（前端）并把 tauri.conf.json 的
      # resources（backend/packaging/dist/daxi）打进安装包。
      # createUpdaterArtifacts=true 时会额外产出 updater 包（macOS .app.tar.gz /
      # Windows -setup.exe）及对应 .sig —— 需要签名私钥才能生成 .sig。
      - name: Tauri build
        working-directory: frontend
        env:
          # 无密码密钥：只需私钥本身。密钥内容见项目记忆 ci-release-pipeline。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}

      # 收集两类产物：
      #   1) 面向人的安装包（dmg/exe/deb/AppImage）——客户手动下载安装那一次用。
      #   2) updater 产物（macOS *.app.tar.gz / Windows *-setup.exe）及其 .sig ——
      #      自动更新链路用，assemble-latest-json job 靠 .sig 组装 latest.json。
      # updater 产物按平台/架构改名成带 LABEL 的稳定文件名，供 latest.json 里
      # 的 URL 直接引用（GitHub Release 附件是扁平命名空间，名字必须全局唯一）。
      - name: Collect installers
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          case "$version" in refs/*|"") version="dev" ;; esac

          bundle="frontend/src-tauri/target/$RUST_TARGET/release/bundle"
          out="release-assets"
          mkdir -p "$out"

          if [ ! -d "$bundle" ]; then
            echo "::error::未找到 bundle 目录: $bundle"
            find frontend/src-tauri/target -maxdepth 4 -type d -name bundle || true
            exit 1
          fi

          # --- 1) 安装包（不含 updater 的 .tar.gz / -setup.exe，避免与下方重名冲突） ---
          found=0
          while IFS= read -r f; do
            base="$(basename "$f")"
            # nsis 的 -setup.exe 就是 Windows updater 产物，留给下面按 LABEL 收；
            # 这里只收非 updater 安装包。
            ext="${f##*.}"
            cp "$f" "$out/Daolue-${version}-${LABEL}.${ext}"
            echo "collected installer: Daolue-${version}-${LABEL}.${ext}"
            found=$((found + 1))
          done < <(find "$bundle" -type f \
            \( -name '*.dmg' -o -name '*.msi' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) | sort)

          # --- 2) updater 产物 + 签名 ---
          # macOS: bundle/macos/*.app.tar.gz(.sig)
          # Windows(nsis): bundle/nsis/*-setup.exe(.sig)
          while IFS= read -r sig; do
            art="${sig%.sig}"
            # 扩展名不能用 ${art#*.}：版本号里有点（1.0.4）会被误切。
            # 按已知后缀判定：macOS updater 是多段 .app.tar.gz，其余取最后一段。
            case "$art" in
              *.app.tar.gz) artext="app.tar.gz" ;;
              *)            artext="${art##*.}" ;;
            esac
            newname="Daolue-${version}-${LABEL}.${artext}"
            cp "$art" "$out/$newname"
            cp "$sig" "$out/$newname.sig"
            echo "collected updater: $newname (+ .sig)"
            found=$((found + 1))
          done < <(find "$bundle" -type f -name '*.sig' | sort)

          if [ "$found" -eq 0 ]; then
            echo "::error::bundle 目录里没有任何产物"
            find "$bundle" -type f | head -50
            exit 1
          fi
          ls -la "$out"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Daolue ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            ## Daolue ${{ github.ref_name }}

            大麦/猫眼演出数据采集桌面客户端。

            ### 下载

            - **Windows (x86_64)**: `Daolue-${{ github.ref_name }}-windows-x86_64.exe`（安装版）
            - **macOS (Apple Silicon)**: `Daolue-${{ github.ref_name }}-macos-aarch64.dmg`
            - **Linux (x86_64)**: `Daolue-${{ github.ref_name }}-linux-x86_64.deb` / `.AppImage`

            > 已安装过的用户无需手动下载：应用会自动检查并更新到此版本。
            >
            > macOS 包未做 Apple 签名和公证，首次打开需右键 → 打开，或在
            > 「系统设置 → 隐私与安全性」中允许运行。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 发版后组装 updater 用的 latest.json 并上传到同一 Release。
  # 客户端 endpoint 指向 releases/latest/download/latest.json，据此判定新版本、
  # 校验 .sig 签名后下载。缺了这个 job，自动更新就没有可拉取的清单。
  assemble-latest-json:
    name: Assemble latest.json
    needs: publish
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY"
          ls -la dl

      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          base_url="https://github.com/$REPO/releases/download/$TAG"

          mac_url=""; mac_sig=""
          win_url=""; win_sig=""
          shopt -s nullglob
          for sig in dl/*.sig; do
            base=${sig%.sig}
            fname=$(basename "$base")
            url="$base_url/$fname"
            sig_content=$(cat "$sig")
            case "$fname" in
              *macos-aarch64.app.tar.gz) mac_url="$url"; mac_sig="$sig_content" ;;
              *windows-x86_64.exe)       win_url="$url"; win_sig="$sig_content" ;;
            esac
          done

          tmp_json=$(mktemp)
          {
            echo '{'
            echo "  \"version\": \"$VERSION\","
            echo "  \"notes\": \"Release $TAG\","
            echo "  \"pub_date\": \"$PUB_DATE\","
            echo '  "platforms": {'
            first=1
            if [ -n "$mac_url" ] && [ -n "$mac_sig" ]; then
              [ $first -eq 0 ] && echo ','
              printf '    "darwin-aarch64": {"signature": "%s", "url": "%s"}' "$mac_sig" "$mac_url"
              first=0
            fi
            if [ -n "$win_url" ] && [ -n "$win_sig" ]; then
              [ $first -eq 0 ] && echo ','
              printf '    "windows-x86_64": {"signature": "%s", "url": "%s"}' "$win_sig" "$win_url"
              first=0
            fi
            echo ''
            echo '  }'
            echo '}'
          } > "$tmp_json"
          echo "Generated latest.json:" && cat "$tmp_json"
          # 至少要有一个平台，否则客户端拉到空清单
          if [ "$first" -eq 1 ]; then
            echo "::error::latest.json 没有任何平台条目——updater 产物或 .sig 缺失"
            exit 1
          fi
          mv "$tmp_json" latest.json

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"
