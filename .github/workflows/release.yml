name: Release

# 打 tag（v*）自动在各平台打包并发布 GitHub Release；也可手动触发只跑构建。
#
# 关键约束（见 BUILD.md / 项目记忆）：
# - PyInstaller 不能跨平台、也不能跨架构，所以每个目标平台/架构都要在对应 runner 上原生打后端。
#   macOS 因此只出 arm64(macos-14) 原生包，不用 universal 壳（Intel 见 matrix 注释）。
# - Playwright 的有头 Chromium 和无头 headless_shell 是两个不同二进制，两个都必须打进包。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
          # bundles 必须带 app：createUpdaterArtifacts 只在打 app 目标时才产出
          # macOS 的 updater 包（*.app.tar.gz + .sig）。只打 dmg 的话 Release 里
          # 没有 darwin-aarch64 条目，latest.json 缺该平台，Mac 客户端 check()
          # 直接报错 —— v1.0.4/v1.0.5 的「检查更新失败」就是这个原因。
          - label: macos-aarch64
            os: macos-14
            rust_target: aarch64-apple-darwin
            bundles: app,dmg
          # Intel Mac（macos-13）暂时下掉：v1.0.1 时该 runner 排队 2.5 小时仍未分配，
          # 把整条流水线和 Release 一起堵死。Apple Silicon 已是主流，需要 Intel 包时
          # 再把下面三行放回 matrix 即可（构建本身是通的，只是拿不到机器）。
          # - label: macos-x86_64
          #   os: macos-13
          #   rust_target: x86_64-apple-darwin
          #   bundles: dmg
          # 不打 rpm：ubuntu runner 没有 rpmbuild，客户也只用 Win/Mac。
          - label: linux-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf \
            libssl-dev librsvg2-dev libxdo-dev \
            libgtk-3-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 必须在 PyInstaller 之前同时写入桌面版本和后端构建身份。只改
      # tauri.conf.json 会让新版桌面继续携带无法识别的旧后端。
      - name: Stamp release identity from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
          RELEASE_VERSION: ${{ github.ref_name }}
          BACKEND_BUILD_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          if ! [[ "$OSS_BUCKET" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::OSS_BUCKET 缺失或不是合法的 OSS bucket 名"
            exit 1
          fi
          updater_url="https://${OSS_BUCKET}.${OSS_ENDPOINT}/releases/latest.json"
          python scripts/stamp_release.py \
            --version "$version" \
            --build-id "$BACKEND_BUILD_ID" \
            --updater-url "$updater_url"
          echo "stamped desktop/backend version: $version"
          echo "stamped backend build id: $BACKEND_BUILD_ID"
          echo "stamped updater endpoint: $updater_url"

      - name: Install uv
        run: pip install uv

      - name: Install backend deps + PyInstaller
        shell: bash
        run: |
          set -euxo pipefail
          uv venv
          uv pip install -e ".[dev]"
          uv pip install pyinstaller

      # 下到项目内固定目录，避免在后续步骤猜 Chromium revision 号。
      - name: Download Playwright Chromium
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
        run: uv run playwright install chromium

      - name: Build backend binary (PyInstaller)
        shell: bash
        working-directory: packaging
        run: uv run pyinstaller daxi.spec --noconfirm

      # 运行时 app/core/paths.py:setup_browser_env() 会把 PLAYWRIGHT_BROWSERS_PATH
      # 指向后端 exe 同级的 ms-playwright/。
      # macOS 必须用 ditto：cp -R 会破坏 Chromium .app bundle 里的符号链接和权限。
      - name: Bundle Chromium into backend dist
        shell: bash
        run: |
          set -euxo pipefail
          src="pw-browsers"
          dst="packaging/dist/daxi/ms-playwright"
          mkdir -p "$dst"
          if [ "$RUNNER_OS" = "macOS" ]; then
            for d in "$src"/*; do
              ditto "$d" "$dst/$(basename "$d")"
            done
          else
            cp -r "$src"/* "$dst"/
          fi
          ls -la "$dst"

      # 有头和无头是两个不同的 Chromium 二进制，客户场景两个都要用到，
      # 只带一个会在另一模式下确定性崩溃 —— 这里提前拦住，别等客户发现。
      - name: Verify both Chromium builds are bundled
        shell: bash
        run: |
          set -euo pipefail
          dst="packaging/dist/daxi/ms-playwright"
          headful=$(find "$dst" -maxdepth 1 -type d -name 'chromium-*' | head -1 || true)
          headless=$(find "$dst" -maxdepth 1 -type d -name 'chromium_headless_shell-*' | head -1 || true)
          [ -n "$headful" ]  || { echo "::error::缺少有头 Chromium (chromium-*)"; exit 1; }
          [ -n "$headless" ] || { echo "::error::缺少无头 Chromium (chromium_headless_shell-*)"; exit 1; }
          echo "✅ headful:  $headful"
          echo "✅ headless: $headless"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri
          key: ${{ matrix.label }}

      # tauri build 会顺带跑 npm run build（前端）并把 tauri.conf.json 的
      # resources（packaging/dist/daxi）打进安装包。
      # createUpdaterArtifacts=true 时会额外产出 updater 包（macOS .app.tar.gz /
      # Windows -setup.exe）及对应 .sig —— 需要签名私钥才能生成 .sig。
      - name: Tauri build
        working-directory: web
        env:
          # 无密码密钥：只需私钥本身。密钥内容见项目记忆 ci-release-pipeline。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}

      # 收集两类产物：
      #   1) 面向人的安装包（dmg/exe/deb/AppImage）——客户手动下载安装那一次用。
      #   2) updater 产物（macOS *.app.tar.gz / Windows *-setup.exe）及其 .sig ——
      #      自动更新链路用，assemble-latest-json job 靠 .sig 组装 latest.json。
      # updater 产物按平台/架构改名成带 LABEL 的稳定文件名，供 latest.json 里
      # 的 URL 直接引用（GitHub Release 附件是扁平命名空间，名字必须全局唯一）。
      - name: Collect installers
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          case "$version" in refs/*|"") version="dev" ;; esac

          bundle="web/src-tauri/target/$RUST_TARGET/release/bundle"
          out="release-assets"
          mkdir -p "$out"

          if [ ! -d "$bundle" ]; then
            echo "::error::未找到 bundle 目录: $bundle"
            find web/src-tauri/target -maxdepth 4 -type d -name bundle || true
            exit 1
          fi

          # --- 1) 安装包（不含 updater 的 .tar.gz / -setup.exe，避免与下方重名冲突） ---
          found=0
          while IFS= read -r f; do
            base="$(basename "$f")"
            # nsis 的 -setup.exe 就是 Windows updater 产物，留给下面按 LABEL 收；
            # 这里只收非 updater 安装包。
            ext="${f##*.}"
            cp "$f" "$out/Daolue-${version}-${LABEL}.${ext}"
            echo "collected installer: Daolue-${version}-${LABEL}.${ext}"
            found=$((found + 1))
          done < <(find "$bundle" -type f \
            \( -name '*.dmg' -o -name '*.msi' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) | sort)

          # --- 2) updater 产物 + 签名 ---
          # macOS: bundle/macos/*.app.tar.gz(.sig)
          # Windows(nsis): bundle/nsis/*-setup.exe(.sig)
          while IFS= read -r sig; do
            art="${sig%.sig}"
            # 扩展名不能用 ${art#*.}：版本号里有点（1.0.4）会被误切。
            # 按已知后缀判定：macOS updater 是多段 .app.tar.gz，其余取最后一段。
            case "$art" in
              *.app.tar.gz) artext="app.tar.gz" ;;
              *)            artext="${art##*.}" ;;
            esac
            newname="Daolue-${version}-${LABEL}.${artext}"
            cp "$art" "$out/$newname"
            cp "$sig" "$out/$newname.sig"
            echo "collected updater: $newname (+ .sig)"
            found=$((found + 1))
          done < <(find "$bundle" -type f -name '*.sig' | sort)

          if [ "$found" -eq 0 ]; then
            echo "::error::bundle 目录里没有任何产物"
            find "$bundle" -type f | head -50
            exit 1
          fi
          ls -la "$out"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Daolue ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            ## Daolue ${{ github.ref_name }}

            大麦/猫眼演出数据采集桌面客户端。

            ### 下载

            - **Windows (x86_64)**: `Daolue-${{ github.ref_name }}-windows-x86_64.exe`（安装版）
            - **macOS (Apple Silicon)**: `Daolue-${{ github.ref_name }}-macos-aarch64.dmg`
            - **Linux (x86_64)**: `Daolue-${{ github.ref_name }}-linux-x86_64.deb` / `.AppImage`

            > v1.0.14 / v1.0.15 内置了错误的 OSS 更新地址，这两个版本需手动安装
            > 当前版本一次；安装后，后续版本即可在应用内自动更新。
            >
            > macOS 包未做 Apple 签名和公证，首次打开需右键 → 打开，或在
            > 「系统设置 → 隐私与安全性」中允许运行。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 发版后分别组装 OSS / GitHub updater 清单并上传。客户端优先使用国内 OSS，
  # GitHub Release 作为独立备用源；两个清单各自引用同源更新包。
  assemble-latest-json:
    name: Assemble latest.json
    needs: publish
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY"
          ls -la dl

      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          # 与下方 Upload to OSS 步骤保持一致
          OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          oss_base_url="https://${OSS_BUCKET}.${OSS_ENDPOINT}/releases"
          github_base_url="https://github.com/${REPO}/releases/download/${TAG}"

          mac_file=""; mac_sig=""
          win_file=""; win_sig=""
          shopt -s nullglob
          for sig in dl/*.sig; do
            base=${sig%.sig}
            fname=$(basename "$base")
            sig_content=$(cat "$sig")
            case "$fname" in
              *macos-aarch64.app.tar.gz) mac_file="$fname"; mac_sig="$sig_content" ;;
              *windows-x86_64.exe)       win_file="$fname"; win_sig="$sig_content" ;;
            esac
          done

          # 两个平台都应存在；缺一个也会让对应客户端在 check() 阶段失败。
          if [ -z "$mac_file" ] || [ -z "$mac_sig" ] || \
             [ -z "$win_file" ] || [ -z "$win_sig" ]; then
            echo "::error::latest.json 平台条目不完整——updater 产物或 .sig 缺失"
            exit 1
          fi

          write_manifest() {
            local base_url="$1"
            local output="$2"
            {
              echo '{'
              echo "  \"version\": \"$VERSION\","
              echo "  \"notes\": \"Release $TAG\","
              echo "  \"pub_date\": \"$PUB_DATE\","
              echo '  "platforms": {'
              printf '    "darwin-aarch64": {"signature": "%s", "url": "%s/%s"},\n' \
                "$mac_sig" "$base_url" "$mac_file"
              printf '    "windows-x86_64": {"signature": "%s", "url": "%s/%s"}\n' \
                "$win_sig" "$base_url" "$win_file"
              echo '  }'
              echo '}'
            } > "$output"
          }

          # 每个备用源都引用自身托管的更新包，OSS 整体不可用时 GitHub 才能真正兜底。
          write_manifest "$github_base_url" latest.json
          write_manifest "$oss_base_url" latest-oss.json
          echo "Generated GitHub latest.json:"
          cat latest.json
          echo "Generated OSS latest.json:"
          cat latest-oss.json

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"

      # 把 latest.json + updater 产物上传到阿里云 OSS，客户端无需访问 GitHub 即可更新。
      - name: Upload to Aliyun OSS
        env:
          OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
        run: |
          set -euxo pipefail
          # 下载 ossutil（官方静态二进制，无需 apt）
          wget -q https://gosspublic.alicdn.com/ossutil/1.7.15/ossutil64 -O ossutil
          chmod +x ossutil

          # OSS 清单中的下载 URL 也指向 OSS；每次发版覆盖 latest.json。
          ./ossutil cp latest-oss.json "oss://${OSS_BUCKET}/releases/latest.json" \
            -e "$OSS_ENDPOINT" -i "$OSS_KEY_ID" -k "$OSS_KEY_SECRET" -f

          # 上传收集阶段重命名后的 updater 产物及其 .sig。Windows 原始文件虽是
          # *-setup.exe，但此处 release asset 已统一为 *-windows-x86_64.exe。
          for f in dl/*-macos-aarch64.app.tar.gz \
                   dl/*-macos-aarch64.app.tar.gz.sig \
                   dl/*-windows-x86_64.exe \
                   dl/*-windows-x86_64.exe.sig; do
            [ -f "$f" ] || continue
            ./ossutil cp "$f" "oss://${OSS_BUCKET}/releases/$(basename "$f")" \
              -e "$OSS_ENDPOINT" -i "$OSS_KEY_ID" -k "$OSS_KEY_SECRET" -f
            echo "uploaded: $(basename "$f")"
          done

      # 不只相信 ossutil 的上传退出码：从客户端实际访问的公网 URL 回读清单，
      # 并逐个检查清单中的更新包，避免 endpoint/bucket/地域再次配错后仍发布成功。
      - name: Verify public updater feed
        env:
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest_url="https://${OSS_BUCKET}.${OSS_ENDPOINT}/releases/latest.json"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            "$manifest_url" -o uploaded-latest.json
          cmp latest-oss.json uploaded-latest.json

          EXPECTED_ORIGIN="https://${OSS_BUCKET}.${OSS_ENDPOINT}" node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("uploaded-latest.json", "utf8"));
            const expectedVersion = process.env.RELEASE_VERSION.replace(/^v/, "");
            if (manifest.version !== expectedVersion) {
              throw new Error(`清单版本 ${manifest.version} 与 ${expectedVersion} 不一致`);
            }
            for (const platform of ["darwin-aarch64", "windows-x86_64"]) {
              const entry = manifest.platforms?.[platform];
              if (!entry?.url || !entry?.signature) {
                throw new Error(`latest.json 缺少 ${platform} 的 URL 或签名`);
              }
              if (!entry.url.startsWith(`${process.env.EXPECTED_ORIGIN}/releases/`)) {
                throw new Error(`${platform} 的下载地址与发布 OSS 不一致: ${entry.url}`);
              }
              process.stdout.write(entry.url + "\n");
            }
          ' > updater-urls.txt

          while IFS= read -r url; do
            curl --fail --silent --show-error --location --head \
              --retry 5 --retry-all-errors --retry-delay 2 "$url"
          done < updater-urls.txt
