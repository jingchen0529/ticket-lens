name: Build Linux Desktop

# 在 Linux 上打 Tauri 安装包（AppImage + deb）
# 触发：打 tag（v*）自动发布，或手动 workflow_dispatch
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install pyinstaller

      # 下载 Playwright Chromium 到固定目录
      - name: Download Playwright Chromium (into bundle dir)
        working-directory: backend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/backend/pw-browsers
        run: |
          uv run playwright install chromium

      - name: Build backend binary (PyInstaller)
        working-directory: backend/packaging
        run: |
          uv run pyinstaller daxi.spec --noconfirm

      # 把 Chromium 复制到 backend dist 目录
      - name: Bundle Chromium into backend dist
        run: |
          mkdir -p backend/packaging/dist/daxi/ms-playwright
          cp -r backend/pw-browsers/* backend/packaging/dist/daxi/ms-playwright/
          ls -la backend/packaging/dist/daxi/ms-playwright/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # Tauri 打 Linux 包（AppImage + deb）
      - name: Tauri build
        working-directory: frontend
        run: npm run tauri:build:linux

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: daxi-linux-installers
          path: |
            frontend/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            frontend/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error
