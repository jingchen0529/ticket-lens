name: Build macOS Desktop

# 在 macOS 上打 Tauri 通用二进制安装包
# 触发：打 tag（v*）自动发布，或手动 workflow_dispatch
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install pyinstaller

      # 下载 Playwright Chromium 到固定目录
      - name: Download Playwright Chromium (into bundle dir)
        working-directory: backend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/backend/pw-browsers
        run: |
          uv run playwright install chromium

      - name: Build backend binary (PyInstaller)
        working-directory: backend/packaging
        run: |
          uv run pyinstaller daxi.spec --noconfirm

      # 把 Chromium 复制到 backend dist 目录
      - name: Bundle Chromium into backend dist
        run: |
          mkdir -p backend/packaging/dist/daxi/ms-playwright
          cp -r backend/pw-browsers/* backend/packaging/dist/daxi/ms-playwright/
          ls -la backend/packaging/dist/daxi/ms-playwright/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # Tauri 打通用二进制（支持 Intel 和 Apple Silicon）
      - name: Tauri build (universal binary)
        working-directory: frontend
        run: npm run tauri:build:macos

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: daxi-macos-installer
          path: |
            frontend/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
