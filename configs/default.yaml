browser:
  headless: true
  navigation_timeout_ms: 45000
  proxy: ''
  slow_mo_ms: 0
  timeout_ms: 30000
  user_agent: ''
captcha:
  allow_manual: true
  api_key: ''
  auto: true
  cookie_dir: data/cookies
  fruit_captcha_type: 1358
  fruit_max_rounds: 3
  fruit_scan_step: 5
  fruit_strategy: provider_first
  manual_wait_seconds: 120
  password: ''  # 在应用"系统设置"页面配置
  persist_cookies: true
  provider: bingtop
  soft_id: ''
  username: ''  # 在应用"系统设置"页面配置
crawl:
  cities:
  - 北京
  - 上海
  keywords: []
  max_pages: 3
  request_delay_seconds: 1.5
  scroll_pause_ms: 800
  enrich_detail: true
  # subpage 全局最小间隔（秒），实际会再加 0～25% 随机抖动。
  detail_delay_seconds: 1.5
  # 0 = 不截断日期；如果限制导致不完整，任务会失败且拒绝降级入库。
  detail_date_limit: 0
  # 单个详情子请求最多 3 次，每次失败后固定等待 2 秒。
  detail_retry_attempts: 3
  detail_retry_delay_seconds: 2
  detail_retry_max_backoff_seconds: 2
  # 整项目不再冷却重跑；PC 失败转移动端，仍失败则继续下一个项目。
  detail_project_attempts: 1
  detail_project_cooldown_seconds: 0
pipeline:
  dedupe: true
  drop_invalid: true
sources:
  damai:
    base_url: https://www.damai.cn
    captcha:
      auto: true
    enabled: true
    search_url: https://search.damai.cn/search.htm
  maoyan:
    base_url: https://show.maoyan.com
    captcha:
      auto: true
    enabled: true
    list_url: https://show.maoyan.com/qqw#/list
storage:
  backend: sqlite
  db_path: data/daxi.sqlite3
  output_dir: data
  run_subdir: false
