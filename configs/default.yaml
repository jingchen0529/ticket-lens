browser:
  headless: true
  navigation_timeout_ms: 45000
  proxy: ''
  slow_mo_ms: 0
  timeout_ms: 30000
  user_agent: ''
captcha:
  allow_manual: true
  api_key: ''
  auto: true
  cookie_dir: data/cookies
  fruit_captcha_type: 1358
  fruit_max_rounds: 3
  fruit_scan_step: 5
  fruit_strategy: provider_first
  manual_wait_seconds: 120
  password: ''  # 在应用"系统设置"页面配置
  persist_cookies: true
  provider: bingtop
  soft_id: ''
  username: ''  # 在应用"系统设置"页面配置
crawl:
  cities:
  - 北京
  - 上海
  keywords: []
  max_pages: 3
  request_delay_seconds: 1.5
  scroll_pause_ms: 800
  enrich_detail: true
  detail_delay_seconds: 0.35
  detail_date_limit: 40
pipeline:
  dedupe: true
  drop_invalid: true
sources:
  damai:
    base_url: https://www.damai.cn
    captcha:
      auto: true
    enabled: true
    search_url: https://search.damai.cn/search.htm
  maoyan:
    base_url: https://show.maoyan.com
    captcha:
      auto: true
    enabled: true
    list_url: https://show.maoyan.com/qqw#/list
storage:
  backend: sqlite
  db_path: data/daxi.sqlite3
  output_dir: data
  run_subdir: false
